name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore (Simulation + Tests only)
        run: dotnet restore Simulation/Simulation.csproj Tests/Tests.csproj

      - name: Build (Release)
        run: dotnet build Simulation/Simulation.csproj Tests/Tests.csproj --no-restore --configuration Release

      - name: Test (Release)
        run: dotnet test Tests/Tests.csproj --no-build --configuration Release --verbosity normal

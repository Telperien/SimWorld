name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: |
          dotnet restore Simulation/Simulation.csproj
          dotnet restore Tests/Tests.csproj
          dotnet restore WorldSim.csproj

      - name: Build (Release)
        run: |
          dotnet build Simulation/Simulation.csproj --no-restore --configuration Release
          dotnet build Tests/Tests.csproj --no-restore --configuration Release
          dotnet build WorldSim.csproj --no-restore --configuration Release

      - name: Test (Release)
        run: dotnet test Tests/Tests.csproj --no-build --configuration Release --verbosity normal
